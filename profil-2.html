<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Otomoto — подбор авто</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--mut:#8b93a7;--ok:#2fbf71;--wn:#e8b339;--bd:#e0574a;--ln:#252a34}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
h1{margin:0 0 4px;font-size:22px}
.meta{color:var(--mut);font-size:13px;margin-bottom:16px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;font-size:13px}
.stat b{display:block;font-size:20px}
.filters{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.filters button{background:var(--card);color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px}
.filters button.on{border-color:#4a5568;background:#20252f}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln);font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
.risk{white-space:nowrap;font-variant-numeric:tabular-nums}
.price{white-space:nowrap}
.ttl{font-weight:600}
.flags{color:var(--mut);font-size:12px;max-width:280px}
a{color:#7aa2f7;text-decoration:none}a:hover{text-decoration:underline}
tr.good{border-left:3px solid var(--ok)}tr.warn{border-left:3px solid var(--wn)}tr.bad{border-left:3px solid var(--bd)}
.drop{color:var(--ok);font-size:12px;font-weight:600}
tr.bad .ttl{color:var(--mut)}
@media(max-width:900px){.flags{display:none}th:nth-child(9){display:none}}
</style></head><body>
<h1>Otomoto — подбор авто</h1>
<div class="meta">Обновлено 2026-09-20 10:10 · год не важен · камера не важна · нормальный пробег · до 45 000 zł</div>
<div class="meta"><a href="index.html">Профиль 1 — строгий</a> · <b>Профиль 2 — свободный</b></div>
<div class="stats">
<div class="stat"><b>0</b>всего</div>
<div class="stat"><b style="color:var(--ok)">0</b>чистых</div>
<div class="stat"><b style="color:var(--wn)">0</b>с вопросами</div>
<div class="stat"><b style="color:var(--bd)">0</b>отбракованных</div>
</div>
<div class="filters">
<button class="on" data-f="all">Все</button>
<button data-f="good">🟢 Чистые</button>
<button data-f="warn">🟡 Вопросы</button>
<button data-f="bad">🔴 Бракованные</button>
</div>
<table><thead><tr>
<th>Риск</th><th>Цена</th><th>Год</th><th>Пробег</th><th>Топливо</th><th>КПП</th><th>Модель</th><th>Город</th><th>Замечания</th><th></th>
</tr></thead><tbody>
<tr><td colspan="10">Ничего не найдено</td></tr>
</tbody></table>
<script>
document.querySelectorAll('.filters button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.filters button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    var f=b.dataset.f;
    document.querySelectorAll('tbody tr').forEach(function(tr){
      tr.style.display=(f==='all'||tr.classList.contains(f))?'':'none';
    });
  });
});
</script>
</body></html>
